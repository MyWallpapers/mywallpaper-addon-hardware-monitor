[package]
name = "mywallpaper-hardware-monitor"
version = "1.0.2"
edition = "2021"
publish = false

[[bin]]
name = "hardware-monitor"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_System_Performance", "Win32_System_Power", "Win32_System_SystemInformation",
  "Win32_System_Threading", "Win32_Storage_FileSystem",
] }
